server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro genera rutas como directorios con index.html (p.ej. /normativa/index.html);
    # try_files intenta el path literal, luego como directorio, y cae al 404 estático.
    location / {
        try_files $uri $uri/ /404.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cabeceras de seguridad — portal público sin datos confidenciales,
    # pero endurecido por ser institucional (Rama Judicial)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
